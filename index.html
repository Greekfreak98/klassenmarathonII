<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Klassenmarathon</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <!-- Leaflet Routing -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"/>

  <style>
    :root {
      --primary: #e8431a;
      --secondary: #1a73e8;
      --accent: #34a853;
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #1e1e2e;
      --muted: #6b7280;
      --radius: 14px;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(135deg, var(--primary) 0%, #c1300f 100%);
      color: #fff;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: 0 2px 12px rgba(232,67,26,0.3);
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo { font-size: 2rem; }
    .header-title h1 { font-size: 1.4rem; font-weight: 800; line-height: 1.2; }
    .header-title p  { font-size: 0.85rem; opacity: 0.85; margin-top: 2px; }
    #btn-login {
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.6);
      color: #fff;
      padding: 8px 18px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      transition: background 0.2s;
    }
    #btn-login:hover { background: rgba(255,255,255,0.35); }

    /* ── LAYOUT ── */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 20px;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    /* ── CARDS ── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
    }
    .card-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* ── MAP ── */
    #map {
      height: 460px;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    @media (max-width: 900px) { #map { height: 320px; } }

    /* ── PROGRESS ── */
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 10px;
    }
    .progress-km { font-size: 2rem; font-weight: 900; color: var(--primary); line-height: 1; }
    .progress-km span { font-size: 1rem; font-weight: 500; color: var(--muted); }
    .progress-pct { font-size: 1rem; font-weight: 700; color: var(--accent); }
    .progress-bar-wrap {
      background: #e9ecef;
      border-radius: 50px;
      height: 18px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 50px;
      background: linear-gradient(90deg, var(--primary), #f97316);
      transition: width 1s cubic-bezier(.4,0,.2,1);
      min-width: 4px;
    }
    .progress-sub {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: right;
    }

    /* ── STATS ── */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }
    .stat-box {
      background: var(--bg);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }
    .stat-box .val { font-size: 1.4rem; font-weight: 800; color: var(--secondary); }
    .stat-box .lbl { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

    /* ── LOG ── */
    .log-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
    .log-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--bg);
      border-left: 4px solid var(--primary);
      border-radius: 10px;
    }
    .log-emoji { font-size: 1.4rem; flex-shrink: 0; }
    .log-info { flex: 1; }
    .log-info strong { font-size: 0.9rem; display: block; }
    .log-info small { color: var(--muted); font-size: 0.75rem; }
    .log-km { font-weight: 800; color: var(--primary); font-size: 0.95rem; white-space: nowrap; }

    /* ── MILESTONES ── */
    .milestone-list { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; }
    .milestone-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--bg);
      font-size: 0.88rem;
    }
    .milestone-item.reached { background: #d1fae5; }
    .milestone-item .m-emoji { font-size: 1.3rem; }
    .milestone-item .m-info { flex: 1; }
    .milestone-item .m-km { font-weight: 700; color: var(--muted); font-size: 0.8rem; }
    .milestone-badge {
      font-size: 0.7rem;
      background: var(--accent);
      color: #fff;
      padding: 2px 8px;
      border-radius: 50px;
      font-weight: 700;
    }

    /* ── ADMIN PANEL ── */
    #admin-panel {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #admin-panel.open { display: flex; }
    .admin-box {
      background: #fff;
      border-radius: 20px;
      padding: 28px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .admin-box h2 { font-size: 1.2rem; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--primary); }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 14px rgba(232,67,26,0.35); }
    .btn-primary:hover { box-shadow: 0 6px 20px rgba(232,67,26,0.45); }
    .btn-secondary { background: var(--bg); color: var(--text); }
    .btn-danger { background: #fee2e2; color: #b91c1c; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
    .admin-section { border-top: 1px solid #e5e7eb; margin-top: 20px; padding-top: 20px; }
    .admin-section h3 { font-size: 0.95rem; font-weight: 700; margin-bottom: 12px; }
    .milestone-edit-item {
      display: flex; gap: 8px; align-items: center; margin-bottom: 8px;
    }
    .milestone-edit-item input { flex: 1; }
    .milestone-edit-item input.emoji-input { width: 60px; flex: none; text-align: center; }

    /* ── LOGIN MODAL ── */
    #login-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 9998;
      align-items: center;
      justify-content: center;
    }
    #login-modal.open { display: flex; }
    .login-box {
      background: #fff;
      border-radius: 20px;
      padding: 32px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .login-box .lock { font-size: 2.5rem; margin-bottom: 12px; }
    .login-box h2 { font-size: 1.1rem; font-weight: 800; margin-bottom: 20px; }
    .login-box input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 1rem;
      margin-bottom: 12px;
      outline: none;
    }
    .login-box input:focus { border-color: var(--primary); }
    #login-error { color: #b91c1c; font-size: 0.82rem; margin-top: -6px; margin-bottom: 10px; display: none; }

    /* ── CELEBRATION ── */
    #celebration {
      display: none;
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99999;
      align-items: center;
      justify-content: center;
    }
    #celebration.show { display: flex; }
    .celeb-box {
      background: #fff;
      border-radius: 24px;
      padding: 36px 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      animation: popIn 0.4s cubic-bezier(.175,.885,.32,1.275) forwards;
      pointer-events: all;
    }
    @keyframes popIn {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
